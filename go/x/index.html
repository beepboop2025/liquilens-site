<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://api.liquilens.in; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Open @LiquiLens on X</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #eaf2ff; }
    main { width: min(34rem, calc(100% - 3rem)); padding: 2.5rem; border: 1px solid #20344f; border-radius: 1.25rem; background: #0b1728; box-shadow: 0 1.5rem 5rem #0008; }
    .eyebrow { margin: 0 0 .75rem; color: #71c8ff; font: 700 .75rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.7rem, 7vw, 2.8rem); line-height: 1.05; }
    p { color: #a9b9cc; line-height: 1.6; }
    a { display: inline-block; margin-top: .5rem; padding: .8rem 1rem; border-radius: .7rem; background: #eaf2ff; color: #07111f; font-weight: 800; text-decoration: none; }
  </style>
  <script defer src="/go/x/app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">LiquiLens community</p>
    <h1>Open @LiquiLens on X</h1>
    <p id="detail">Public-data research, timestamps, and evidence limits.</p>
    <a id="continue" href="https://x.com/intent/follow?screen_name=LiquiLens" rel="noopener noreferrer">Open @LiquiLens on X</a>
    <noscript><p>JavaScript is off, so use the button above to continue.</p></noscript>
  </main>
</body>
</html>
