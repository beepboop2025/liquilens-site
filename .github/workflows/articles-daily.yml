name: Publish daily institution-risk article

on:
  schedule:
    - cron: "15 11 * * *" # after the public board refresh and Seiche's daily edition
  workflow_dispatch:
    inputs:
      force:
        description: Replace today's edition after an editorial-code change
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: liquilens-daily-article
  cancel-in-progress: false

jobs:
  write-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job intentionally pushes the reviewed edition to main.
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked verification dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r requirements-ci.txt

      - name: Write today's evidence-led article
        env:
          FORCE: ${{ inputs.force }}
          # No secret means the deterministic newsroom edition still ships.
          # With the secret, the evidence dossier receives writer and standards
          # editor passes before the same deterministic gate.
          EDITORIAL_LLM_API_KEY: ${{ secrets.EDITORIAL_LLM_API_KEY }}
          EDITORIAL_LLM_BASE_URL: ${{ vars.EDITORIAL_LLM_BASE_URL }}
          EDITORIAL_LLM_MODEL: ${{ vars.EDITORIAL_LLM_MODEL }}
          EDITORIAL_REVIEW_MODEL: ${{ vars.EDITORIAL_REVIEW_MODEL }}
          EDITORIAL_REASONING_EFFORT: ${{ vars.EDITORIAL_REASONING_EFFORT }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python3 scripts/daily_article.py "${args[@]}"

      - name: Run editorial and public-surface tests
        run: >-
          python3 -m pytest tests/test_daily_articles.py
          tests/test_investigations.py tests/test_ai_discovery.py -q

      - name: Commit the edition
        run: |
          git config user.name "liquilens-desk"
          git config user.email "desk@liquilens.in"
          git add articles sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "nothing new to publish today"
            exit 0
          fi
          HEADLINE=$(python3 -c "import json; print(json.load(open('articles/index.json'))[0]['headline'])")
          git commit -m "articles: $HEADLINE"
          git pull --rebase origin main
          git push origin main
          echo "PUSHED=1" >> "$GITHUB_ENV"
          echo "PUSHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # A push made with GITHUB_TOKEN does not start another workflow. Trigger
      # the exact-SHA Worker first because Pages refuses to publish static files
      # whose public MCP/catalog edge advertises a different repository SHA.
      - name: Deploy and verify the matching edge Worker
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$remote_sha" = "$PUSHED_SHA"
          previous_run_id=$(gh run list \
            --workflow deploy-catalog-edge.yml \
            --branch main \
            --event workflow_dispatch \
            --commit "$PUSHED_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          gh workflow run deploy-catalog-edge.yml --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list \
              --workflow deploy-catalog-edge.yml \
              --branch main \
              --event workflow_dispatch \
              --commit "$PUSHED_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" && "$run_id" != "$previous_run_id" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          test "$run_id" != "$previous_run_id"
          gh run watch "$run_id" --exit-status --interval 5
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$PUSHED_SHA"

      - name: Deploy and verify the matching Pages artifact
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run_id=$(gh run list \
            --workflow pages.yml \
            --branch main \
            --event workflow_dispatch \
            --commit "$PUSHED_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          gh workflow run pages.yml --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --commit "$PUSHED_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" && "$run_id" != "$previous_run_id" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          test "$run_id" != "$previous_run_id"
          gh run watch "$run_id" --exit-status --interval 5
