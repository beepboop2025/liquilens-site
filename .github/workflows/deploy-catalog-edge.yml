name: Deploy AI catalog edge Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquilens-ai-catalog-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked verification dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Validate the bundled catalog and parity checker
        run: |
          node --test tests/test_catalog_worker.mjs
          python3 -m pytest tests/test_catalog_edge_parity.py -q
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured in the production environment' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured in the production environment' >&2; exit 1; }
      - name: Deploy the exact committed catalog Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy --config wrangler.catalog.jsonc
      - name: Require anonymous served-catalog parity
        run: python3 scripts/verify_catalog_edge.py
