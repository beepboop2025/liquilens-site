name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the published files agree with each other
        env:
          LIQUILENS_OFFLINE: '1'
        run: python3 scripts/verify_public_claims.py
      - name: Run the public-surface test suite
        run: |
          python3 -m pip install 'pytest>=8,<9'
          python3 -m pytest tests -q
      - name: Report where the live API disagrees with the published copy
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/verify_public_claims.py
      - name: Verify the catalog edge fallback
        run: node --test tests/test_catalog_worker.mjs
      - uses: actions/configure-pages@v5
      - name: Keep the unscanned directories out of the artifact
        run: rm -rf scripts tests edge wrangler.catalog.jsonc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
