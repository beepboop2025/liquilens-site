name: Deploy static site to Pages
on:
  status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.repository == 'beepboop2025/liquilens-site' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'status' && github.event.state == 'success' &&
        github.event.context == 'railway-automation - liquilens-site-pr-ci' &&
        github.event.sha == github.sha))
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require authenticated native CI for the exact current main
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_pages_ci.py
      - name: Preserve the complete changed-route range since the last Pages publication
        id: indexnow-range
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_pages_ci.py --indexnow-before
      - name: Require external proof before publishing catalog claims
        timeout-minutes: 3
        run: >-
          python3 scripts/verify_catalog_edge.py --external-proof-only
          --attempts 2 --delay 2 --budget-seconds 150
      - name: Report where the live API disagrees with the published copy
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/verify_public_claims.py
      - name: Report where the catalog edge disagrees with the committed catalog
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/verify_catalog_edge.py --attempts 1
      - name: Preserve postdeployment verifiers outside the site artifact
        run: |
          cp scripts/submit_indexnow.py "$RUNNER_TEMP/submit_indexnow.py"
          cp scripts/verify_pages_ci.py "$RUNNER_TEMP/verify_pages_ci.py"
          mkdir -p "$RUNNER_TEMP/pages-proof/scripts" "$RUNNER_TEMP/pages-proof/.well-known" "$RUNNER_TEMP/pages-proof/protocol/fdc3" "$RUNNER_TEMP/pages-proof/protocol/trade-safety" "$RUNNER_TEMP/pages-proof/protocol/protocol" "$RUNNER_TEMP/pages-proof/protocol/integrations/fdc3"
          cp scripts/verify_catalog_edge.py "$RUNNER_TEMP/pages-proof/scripts/verify_catalog_edge.py"
          cp scripts/verify_financial_evidence_semantics.py "$RUNNER_TEMP/pages-proof/scripts/verify_financial_evidence_semantics.py"
          cp -R protocol/release-evidence "$RUNNER_TEMP/pages-proof/protocol/release-evidence"
          cp .well-known/ai-catalog.json "$RUNNER_TEMP/pages-proof/.well-known/ai-catalog.json"
          cp .well-known/api-catalog.json "$RUNNER_TEMP/pages-proof/.well-known/api-catalog.json"
          cp protocol/catalog.json "$RUNNER_TEMP/pages-proof/protocol/catalog.json"
          cp protocol/financial-evidence-mcp-v0.1.5.json "$RUNNER_TEMP/pages-proof/protocol/financial-evidence-mcp-v0.1.5.json"
          cp protocol/liquilens-trade-safety-request-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/liquilens-trade-safety-request-v1.schema.json"
          cp protocol/liquilens-trade-safety-policy-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/liquilens-trade-safety-policy-v1.schema.json"
          cp protocol/liquilens-broker-preview-reference-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/liquilens-broker-preview-reference-v1.schema.json"
          cp protocol/liquilens-trade-safety-receipt-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/liquilens-trade-safety-receipt-v1.schema.json"
          cp protocol/fdc3/com.liquilens.evidence.schema.json "$RUNNER_TEMP/pages-proof/protocol/fdc3/com.liquilens.evidence.schema.json"
          cp protocol/fdc3/com.liquilens.trade-safety-receipt.schema.json "$RUNNER_TEMP/pages-proof/protocol/fdc3/com.liquilens.trade-safety-receipt.schema.json"
          cp protocol/fdc3/trade-safety-intents.json "$RUNNER_TEMP/pages-proof/protocol/fdc3/trade-safety-intents.json"
          cp protocol/trade-safety/index.html "$RUNNER_TEMP/pages-proof/protocol/trade-safety/index.html"
          cp protocol/trade-safety/share.png "$RUNNER_TEMP/pages-proof/protocol/trade-safety/share.png"
          cp protocol/trade-safety/specification.md "$RUNNER_TEMP/pages-proof/protocol/trade-safety/specification.md"
          cp protocol/trade-safety/adoption-plan.md "$RUNNER_TEMP/pages-proof/protocol/trade-safety/adoption-plan.md"
          cp protocol/protocol/liquilens-trade-safety-request-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/protocol/liquilens-trade-safety-request-v1.schema.json"
          cp protocol/protocol/liquilens-trade-safety-policy-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/protocol/liquilens-trade-safety-policy-v1.schema.json"
          cp protocol/protocol/liquilens-broker-preview-reference-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/protocol/liquilens-broker-preview-reference-v1.schema.json"
          cp protocol/protocol/liquilens-trade-safety-receipt-v1.schema.json "$RUNNER_TEMP/pages-proof/protocol/protocol/liquilens-trade-safety-receipt-v1.schema.json"
          cp protocol/integrations/fdc3/com.liquilens.trade-safety-receipt.schema.json "$RUNNER_TEMP/pages-proof/protocol/integrations/fdc3/com.liquilens.trade-safety-receipt.schema.json"
          cp protocol/integrations/fdc3/trade-safety-intents.json "$RUNNER_TEMP/pages-proof/protocol/integrations/fdc3/trade-safety-intents.json"
          cp llms.txt "$RUNNER_TEMP/pages-proof/llms.txt"
          cp sitemap.xml "$RUNNER_TEMP/pages-proof/sitemap.xml"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Keep the unscanned directories out of the artifact
        run: rm -rf scripts tests edge wrangler.catalog.jsonc requirements-ci.txt package.json package-lock.json node_modules
      - name: Require current protected main immediately before Pages publication
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/verify_pages_ci.py"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        timeout-minutes: 2
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Recheck native result and current protected main before deployment
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/verify_pages_ci.py"
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        timeout-minutes: 5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require deployed Pages bytes to match the protected-main artifact
        timeout-minutes: 3
        env:
          PAGE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          page_base_url="${PAGE_BASE_URL/#http:\/\//https:\/\/}"
          python3 "$RUNNER_TEMP/pages-proof/scripts/verify_catalog_edge.py" \
            --pages-proof-only --pages-base-url "$page_base_url" \
            --attempts 12 --delay 5 --budget-seconds 150
      - name: Notify IndexNow about changed public routes
        if: steps.indexnow-range.outcome == 'success'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ steps.indexnow-range.outputs.before }}
        run: >-
          python3 "$RUNNER_TEMP/submit_indexnow.py"
          --repo .
          --before "$BEFORE_SHA"
          --after "$GITHUB_SHA"
          --key-file ./2147d016bbe54619a8c528de85a1fd80.txt
