name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install hash-locked verification dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Install exact edge dependencies
        run: npm ci --ignore-scripts
      - name: Verify the published files agree with each other
        env:
          LIQUILENS_OFFLINE: '1'
        run: python3 scripts/verify_public_claims.py
      - name: Run the public-surface test suite
        run: python3 -m pytest tests -q
      - name: Report where the live API disagrees with the published copy
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/verify_public_claims.py
      - name: Require the live edge to match the committed catalog and MCP contract
        timeout-minutes: 1
        run: >-
          python3 scripts/verify_catalog_edge.py
          --attempts 1
          --expected-version-tag "$GITHUB_SHA"
      - name: Verify the catalog and remote MCP edge routes
        run: npm run test:edge
      - name: Preserve the search notification helper outside the site artifact
        run: cp scripts/submit_indexnow.py "$RUNNER_TEMP/submit_indexnow.py"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Keep the unscanned directories out of the artifact
        run: rm -rf scripts tests edge wrangler.catalog.jsonc requirements-ci.txt package.json package-lock.json node_modules
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Notify IndexNow about changed public routes
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          python3 "$RUNNER_TEMP/submit_indexnow.py"
          --repo .
          --before "$BEFORE_SHA"
          --after "$GITHUB_SHA"
          --key-file ./2147d016bbe54619a8c528de85a1fd80.txt
