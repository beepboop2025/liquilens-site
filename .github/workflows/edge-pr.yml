name: Public edge contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install hash-locked verification dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes -r requirements-ci.txt
      - name: Install exact edge dependencies
        run: npm ci --ignore-scripts
      - name: Verify site, protocol, security, and worst-case bounds
        env:
          LIQUILENS_OFFLINE: "1"
        run: |
          python3 -m pytest tests -q
          npm run test:edge
          npm audit --audit-level=moderate
          npx --no-install wrangler deploy --config wrangler.catalog.jsonc --dry-run
